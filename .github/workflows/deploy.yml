name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 20m
          command_timeout: 20m

          envs: TARGET_SHA

          script: |
            set -euo pipefail

            APP_DIR="/var/www/motoxplus"
            ENV_FILE="$APP_DIR/.env"

            echo "====================================="
            echo " MotoXPlus Production Deployment"
            echo " Target commit: ${TARGET_SHA}"
            echo "====================================="

            cd "$APP_DIR"

            echo ""
            echo "===== Server Information ====="
            echo "User: $(whoami)"
            echo "Hostname: $(hostname)"
            echo "Directory: $(pwd)"

            echo ""
            echo "===== Environment File ====="

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE does not exist."
              exit 1
            fi

            ls -lh "$ENV_FILE"

            echo ""
            echo "===== Required Environment Variables ====="

            REQUIRED_VARS=(
              DATABASE_URL
              NEXTAUTH_URL
              NEXTAUTH_SECRET
              JWT_SECRET
              ENCRYPTION_KEY
              R2_ACCOUNT_ID
              R2_ACCESS_KEY_ID
              R2_SECRET_ACCESS_KEY
              R2_BUCKET_NAME
              R2_PUBLIC_URL
              RESEND_API_KEY
              EMAIL_FROM
              DELHIVERY_TOKEN
              DELHIVERY_PICKUP_NAME
              DELHIVERY_PICKUP_ADDRESS
              DELHIVERY_PICKUP_CITY
              DELHIVERY_PICKUP_STATE
              DELHIVERY_PICKUP_PHONE
              DELHIVERY_ORIGIN_PINCODE
              COMPANY_GST
              DELHIVERY_CLIENT_NAME
              DELHIVERY_PICKUP_LOCATION_NAME
            )

            MISSING=0

            for VAR in "${REQUIRED_VARS[@]}"; do
              VALUE=$(grep -E "^${VAR}=" "$ENV_FILE" | head -n 1 | cut -d '=' -f 2- || true)

              if [ -z "$VALUE" ]; then
                echo "$VAR = MISSING"
                MISSING=1
              else
                echo "$VAR = FOUND"
              fi
            done

            if [ "$MISSING" -ne 0 ]; then
              echo ""
              echo "ERROR: One or more required environment variables are missing."
              echo "Deployment stopped before database migration or build."
              exit 1
            fi

            echo ""
            echo "===== Environment Verification PASSED ====="

            echo ""
            echo "===== Updating Repository ====="

            git fetch origin main

            git checkout --force "$TARGET_SHA"

            echo "Current commit:"
            git rev-parse HEAD

            echo ""
            echo "===== Installing Dependencies ====="

            npm ci

            echo ""
            echo "===== Database Migration ====="

            npx prisma migrate deploy

            echo ""
            echo "===== Building Application ====="

            npm run build

            echo ""
            echo "===== Reloading Application ====="

            if command -v pm2 >/dev/null 2>&1; then
              echo "PM2 detected."

              if pm2 list | grep -q "motoxplus"; then
                pm2 reload motoxplus --update-env
              else
                echo "ERROR: PM2 is installed but 'motoxplus' process was not found."
                pm2 list
                exit 1
              fi

            elif command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files | grep -q "motoxplus.service"; then
              echo "systemd service detected."
              systemctl restart motoxplus.service

            else
              echo "ERROR: Could not find a MotoXPlus PM2 process or systemd service."
              echo ""
              echo "Available PM2 processes:"
              command -v pm2 >/dev/null 2>&1 && pm2 list || true
              exit 1
            fi

            echo ""
            echo "===== Deployment Complete ====="
            echo "Commit deployed: $(git rev-parse HEAD)"
