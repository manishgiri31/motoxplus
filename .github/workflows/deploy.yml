  deploy:
    name: Deploy
    needs:
      - validate_secrets
      - typecheck_lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH (exact commit, migrate, build, reload, health-gated — no auto-rollback)
        uses: appleboy/ssh-action@v1.2.5
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 20m
          command_timeout: 20m
          envs: TARGET_SHA

          script: |
            set -euo pipefail

            APP_DIR="/var/www/motoxplus"
            ENV_FILE="$APP_DIR/.env"

            echo "====================================="
            echo " MotoXPlus Production Deployment"
            echo " Target commit: ${TARGET_SHA}"
            echo "====================================="

            echo ""
            echo "===== Server Diagnostic ====="

            echo "whoami:   $(whoami)"
            echo "hostname: $(hostname)"
            echo "pwd:      $(pwd)"

            echo -n "Public IP: "
            curl -4 -s https://api.ipify.org || true
            echo ""

            echo "APP_DIR:  $APP_DIR"
            echo "ENV_FILE: $ENV_FILE"

            echo ""
            echo "===== Application Directory ====="

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: Application directory does not exist:"
              echo "$APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            echo "Current commit:"
            git rev-parse HEAD

            echo ""
            echo "===== Environment File ====="

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: Environment file does not exist:"
              echo "$ENV_FILE"
              exit 1
            fi

            ls -lh "$ENV_FILE"
            stat "$ENV_FILE"

            echo ""
            echo "===== Required Environment Variables ====="

            REQUIRED_VARS=(
              DATABASE_URL
              NEXTAUTH_URL
              NEXTAUTH_SECRET
              JWT_SECRET
              ENCRYPTION_KEY
              R2_ACCOUNT_ID
              R2_ACCESS_KEY_ID
              R2_SECRET_ACCESS_KEY
              R2_BUCKET_NAME
              R2_PUBLIC_URL
              RESEND_API_KEY
              EMAIL_FROM
              DELHIVERY_TOKEN
              DELHIVERY_PICKUP_NAME
              DELHIVERY_PICKUP_ADDRESS
              DELHIVERY_PICKUP_CITY
              DELHIVERY_PICKUP_STATE
              DELHIVERY_PICKUP_PHONE
              DELHIVERY_ORIGIN_PINCODE
              COMPANY_GST
              DELHIVERY_CLIENT_NAME
              DELHIVERY_PICKUP_LOCATION_NAME
            )

            MISSING=()

            for VAR in "${REQUIRED_VARS[@]}"; do
              VALUE="$(
                grep -E "^${VAR}=" "$ENV_FILE" \
                  | tail -n 1 \
                  | cut -d '=' -f 2- \
                  || true
              )"

              if [ -z "$VALUE" ] \
                || [ "$VALUE" = "YOUR_VALUE_HERE" ] \
                || [ "$VALUE" = "your_value_here" ] \
                || [ "$VALUE" = "CHANGE_ME" ] \
                || [ "$VALUE" = "PLACEHOLDER" ]; then

                echo "$VAR = MISSING"
                MISSING+=("$VAR")
              else
                echo "$VAR = FOUND"
              fi
            done

            echo ""

            if [ "${#MISSING[@]}" -gt 0 ]; then
              echo "ERROR: Missing or placeholder environment variable(s):"

              for VAR in "${MISSING[@]}"; do
                echo "  - $VAR"
              done

              echo ""
              echo "Aborting before touching the database or building."

              exit 1
            fi

            echo "===== Environment Verification PASSED ====="

            echo ""
            echo "===== Updating Repository ====="

            git fetch origin main

            git checkout --force main

            git reset --hard "$TARGET_SHA"

            echo ""
            echo "Repository is now at:"
            git rev-parse HEAD

            echo ""
            echo "===== Database Migration ====="

            npx prisma migrate deploy

            echo ""
            echo "===== Building Application ====="

            npm run build

            echo ""
            echo "===== Reloading Application ====="

            pm2 reload ecosystem.config.js --update-env \
              || pm2 start ecosystem.config.js --env production

            echo ""
            echo "===== Application Status ====="

            pm2 status

            echo ""
            echo "===== Health Check ====="

            sleep 5

            HEALTH_URL="http://127.0.0.1:3000"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              "$HEALTH_URL" > /dev/null; then

              echo "Health check PASSED"
            else

              echo "Health check FAILED"

              echo ""
              echo "===== PM2 Status ====="

              pm2 status || true

              echo ""
              echo "===== Recent Application Logs ====="

              pm2 logs --lines 50 --nostream || true

              exit 1
            fi

            echo ""
            echo "====================================="
            echo " DEPLOYMENT SUCCESSFUL"
            echo "====================================="

            echo "Commit deployed:"
            git rev-parse HEAD
