name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 20m
          command_timeout: 20m

          script: |
            set -euo pipefail

            APP_DIR="/var/www/motoxplus"
            ENV_FILE="$APP_DIR/.env"

            cd "$APP_DIR"

            echo "====================================="
            echo " MotoXPlus Production Deployment"
            echo " Target commit: $GITHUB_SHA"
            echo "====================================="

            echo ""
            echo "===== Server Information ====="

            echo "Hostname:"
            hostname

            echo ""
            echo "Public IP:"
            curl -4 -s https://api.ipify.org || true
            echo ""

            echo ""
            echo "===== Environment Verification ====="

            REQUIRED_VARS=(
              DATABASE_URL
              NEXTAUTH_URL
              NEXTAUTH_SECRET
              JWT_SECRET
              ENCRYPTION_KEY
              R2_ACCOUNT_ID
              R2_ACCESS_KEY_ID
              R2_SECRET_ACCESS_KEY
              R2_BUCKET_NAME
              R2_PUBLIC_URL
              RESEND_API_KEY
              EMAIL_FROM
              DELHIVERY_TOKEN
              DELHIVERY_PICKUP_NAME
              DELHIVERY_PICKUP_ADDRESS
              DELHIVERY_PICKUP_CITY
              DELHIVERY_PICKUP_STATE
              DELHIVERY_PICKUP_PHONE
              DELHIVERY_ORIGIN_PINCODE
              COMPANY_GST
              DELHIVERY_CLIENT_NAME
              DELHIVERY_PICKUP_LOCATION_NAME
            )

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE does not exist."
              exit 1
            fi

            echo "Environment file:"
            ls -lh "$ENV_FILE"

            echo ""
            echo "Checking required variables..."

            MISSING=()

            for VAR in "${REQUIRED_VARS[@]}"; do
              if ! grep -qE "^${VAR}=.+" "$ENV_FILE"; then
                MISSING+=("$VAR")
                echo "$VAR = MISSING"
              else
                echo "$VAR = FOUND"
              fi
            done

            if [ "${#MISSING[@]}" -ne 0 ]; then
              echo ""
              echo "ERROR: Missing environment variables:"
              printf ' - %s\n' "${MISSING[@]}"
              echo ""
              echo "Deployment aborted before database migration or build."
              exit 1
            fi

            echo ""
            echo "===== Environment verification PASSED ====="

            echo ""
            echo "===== Updating Repository ====="

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo ""
            echo "Current commit:"
            git rev-parse HEAD

            echo ""
            echo "===== Installing Dependencies ====="

            npm ci

            echo ""
            echo "===== Database Migration ====="

            npx prisma migrate deploy

            echo ""
            echo "===== Building Application ====="

            npm run build

            echo ""
            echo "===== Reloading Application ====="

            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload all --update-env
            elif command -v systemctl >/dev/null 2>&1 && systemctl list-units --type=service | grep -q "motoxplus"; then
              systemctl restart motoxplus
            else
              echo "WARNING: No PM2 or motoxplus systemd service detected."
              echo "Application was built successfully, but no process manager was reloaded."
            fi

            echo ""
            echo "===== Deployment Complete ====="

            echo "Commit:"
            git rev-parse HEAD

            echo ""
            echo "====================================="
            echo " MotoXPlus deployment finished"
            echo "====================================="
