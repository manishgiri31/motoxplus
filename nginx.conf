# =============================================================================
# MOTOXPLUS — NGINX PRODUCTION CONFIG
# Ubuntu 24.04 + Let's Encrypt + Cloudflare
# =============================================================================
#
# INSTALL:
#   sudo cp nginx.conf /etc/nginx/sites-available/motoxplus.com
#   sudo ln -sf /etc/nginx/sites-available/motoxplus.com /etc/nginx/sites-enabled/
#   sudo cp cloudflare-ips.conf /etc/nginx/cloudflare-ips.conf
#   sudo nginx -t && sudo nginx -s reload
#   (then set up scripts/vps/refresh-cloudflare-ips.sh on a cron — see that
#   script's header)
#
# REQUIREMENTS:
#   sudo apt install nginx libnginx-mod-brotli
#   sudo certbot --nginx -d motoxplus.com -d www.motoxplus.com
# =============================================================================

# Trust Cloudflare's edge IPs so $remote_addr resolves to the actual visitor,
# not Cloudflare's own connecting IP. WITHOUT this, every request that comes
# through Cloudflare (i.e. all production traffic) arrives at nginx from one
# of Cloudflare's own IPs — $remote_addr (and therefore $binary_remote_addr,
# which every limit_req_zone below keys on) is then the SAME small set of
# Cloudflare IPs for every visitor site-wide, not the visitor's real IP. That
# collapses the "auth" zone's budget into one shared bucket for the entire
# site: any concurrent login traffic exhausts it, nginx starts returning bare
# 429s (no JSON, no Retry-After — see limit_req_status below) for every login
# attempt from every visitor, and the bucket never fully drains because it's
# being fed by site-wide traffic, not one abusive client. This is the classic
# "rate limiter keyed on IP behind a proxy" trap — same class of bug the app
# layer already guards against (see UNKNOWN_IP in src/lib/auth/middleware.ts)
# but nginx itself was never configured for it.
#
# The actual set_real_ip_from/real_ip_header directives live in
# cloudflare-ips.conf (included below), NOT inline here, so
# scripts/vps/refresh-cloudflare-ips.sh can regenerate just that file — via
# cron, ideally — without touching this reviewed, git-tracked config. See
# that file's header for the install path and VPS-HARDENING.md for the
# firewall step this does NOT replace: an attacker connecting directly to
# the origin (bypassing Cloudflare) can't forge CF-Connecting-IP (realip only
# honors it from the listed peers below), but nothing stops them reaching
# the origin at all unless inbound 80/443 is also firewalled to Cloudflare's
# ranges — the app-layer X-Forwarded-For chain (src/lib/auth/middleware.ts's
# getClientIP) has no equivalent trusted-peer gating, so a direct connection
# can still forge ITS first hop and spoof the app's own rate-limit identity.
include /etc/nginx/cloudflare-ips.conf;

# Rate limiting zones (defined in http context — include in /etc/nginx/nginx.conf or here)
limit_req_zone $binary_remote_addr zone=global:20m       rate=60r/m;
limit_req_zone $binary_remote_addr zone=api:10m          rate=30r/m;
# Credential/OTP-guessing endpoints only (POST /api/auth/login, /api/auth/
# login-otp, register, reset-password, etc.) — see the location blocks below.
# Raised from the original 10r/m burst=5 and made more burst-tolerant:
# dealers behind a shared office connection or mobile-carrier CGNAT
# legitimately present as one public IP, and the original budget was tight
# enough that ordinary concurrent logins from behind one such IP could trip
# it. The real per-account brute-force defense is the app-layer LOGIN budget
# (5 failed attempts / 15 min per identifier — see rate-limit-budgets.ts) and
# the DB-backed account lockout, both of which are per-identifier, not
# per-IP; this zone is just a coarse flood backstop in front of them.
limit_req_zone $binary_remote_addr zone=auth:10m         rate=30r/m;
# Read-only NextAuth endpoints (session/csrf/providers) — see the location
# block below. NextAuth's client polls GET /api/auth/session on window focus
# and after every signIn()/signOut() call fetches /api/auth/csrf first;
# neither guesses credentials or costs anything to serve, so they don't
# belong on the same tight budget as the actual login endpoints. A dealer
# with several tabs open, or a page that regains focus a lot, was enough to
# trip the old shared 10r/m "auth" zone on session polling alone, with
# nothing to do with an actual login attempt.
limit_req_zone $binary_remote_addr zone=auth_session:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=upload:5m        rate=5r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# =============================================================================
# Redirect HTTP → HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name motoxplus.com www.motoxplus.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://motoxplus.com$request_uri;
    }
}

# =============================================================================
# Redirect www → non-www (HTTPS)
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.motoxplus.com;

    ssl_certificate     /etc/letsencrypt/live/motoxplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motoxplus.com/privkey.pem;

    return 301 https://motoxplus.com$request_uri;
}

# =============================================================================
# Main HTTPS server
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name motoxplus.com;

    # -------------------------------------------------------------------------
    # TLS Configuration
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/motoxplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motoxplus.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/motoxplus.com/chain.pem;

    # Modern TLS — TLSv1.2 minimum, prefer TLSv1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Compression — gzip + brotli
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/bmp
        image/svg+xml
        image/vnd.microsoft.icon
        image/x-icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Brotli (requires libnginx-mod-brotli)
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # -------------------------------------------------------------------------
    # Timeouts & Buffers
    # -------------------------------------------------------------------------
    client_max_body_size 20M;           # max upload size (product images, etc.)
    client_body_buffer_size 128k;
    client_body_timeout 60s;
    client_header_timeout 30s;
    keepalive_timeout 75s;
    send_timeout 30s;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # -------------------------------------------------------------------------
    # Connection limits
    # -------------------------------------------------------------------------
    limit_conn conn_limit 20;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/motoxplus-access.log combined buffer=512k flush=1m;
    error_log  /var/log/nginx/motoxplus-error.log warn;

    # -------------------------------------------------------------------------
    # Static assets — serve directly from .next/static with aggressive caching
    # -------------------------------------------------------------------------
    location /_next/static/ {
        alias /var/www/motoxplus/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Public files (logo, favicon, etc.)
    location /public/ {
        alias /var/www/motoxplus/public/;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Favicon — short cache
    location = /favicon.ico {
        alias /var/www/motoxplus/public/favicon.ico;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Robots & sitemap — no Nginx auth check
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        # Explicit rather than relying solely on the include above: the app's
        # rate limiter keys on this header, and a missing/wrong value
        # collapses every client into one shared bucket (see
        # src/lib/auth/middleware.ts's UNKNOWN_IP).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=3600";
    }

    # -------------------------------------------------------------------------
    # Read-only NextAuth endpoints — session/csrf/providers. Must be matched
    # BEFORE the general ^/api/auth/ regex below: nginx picks the first
    # matching regex location in file order (not longest-match) for regex
    # locations, so this has to come first or it would never be reached.
    # -------------------------------------------------------------------------
    location ~ ^/api/auth/(session|csrf|providers)$ {
        limit_req zone=auth_session burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_rate_limited;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Auth endpoints — strict rate limiting. Everything else under
    # /api/auth/: POST /api/auth/login, /api/auth/login-otp (send + verify),
    # /api/auth/register, /api/auth/reset-password, /api/auth/forgot-password,
    # /api/auth/verify-mobile, etc. — the actual credential/OTP-guessing
    # surface.
    # -------------------------------------------------------------------------
    location ~ ^/api/auth/ {
        limit_req zone=auth burst=15 nodelay;
        limit_req_status 429;
        # Without this, a request nginx itself rejects here never reaches the
        # app, so it never gets the app's JSON error shape or Retry-After
        # header — it gets nginx's bare HTML error page instead. NextAuth's
        # browser client (next-auth/react) always calls res.json() on this
        # endpoint's response, so an HTML body throws a client-side
        # SyntaxError instead of surfacing any error message at all. This
        # named location gives nginx-level 429s the same JSON shape + header
        # the app would have returned.
        error_page 429 = @auth_rate_limited;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        # Explicit rather than relying solely on the include above: the app's
        # rate limiter keys on this header, and a missing/wrong value
        # collapses every client into one shared bucket (see
        # src/lib/auth/middleware.ts's UNKNOWN_IP).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @auth_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"Too many requests. Please try again in a minute.","code":"RATE_LIMITED","retryAfterSeconds":60}';
    }

    # -------------------------------------------------------------------------
    # Upload endpoints — strict rate limiting + larger body
    # -------------------------------------------------------------------------
    location ~ ^/api/upload/ {
        limit_req zone=upload burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        # Explicit rather than relying solely on the include above: the app's
        # rate limiter keys on this header, and a missing/wrong value
        # collapses every client into one shared bucket (see
        # src/lib/auth/middleware.ts's UNKNOWN_IP).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # API routes — moderate rate limiting
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        # Explicit rather than relying solely on the include above: the app's
        # rate limiter keys on this header, and a missing/wrong value
        # collapses every client into one shared bucket (see
        # src/lib/auth/middleware.ts's UNKNOWN_IP).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
    }

    # -------------------------------------------------------------------------
    # Everything else → Next.js app
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=global burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        # Explicit rather than relying solely on the include above: the app's
        # rate limiter keys on this header, and a missing/wrong value
        # collapses every client into one shared bucket (see
        # src/lib/auth/middleware.ts's UNKNOWN_IP).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support (Next.js HMR in dev)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -------------------------------------------------------------------------
    # Block common attack vectors
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.(env|log|sh|sql|bak|git|yml|yaml|ini|conf)$ {
        deny all;
        return 404;
    }

    # -------------------------------------------------------------------------
    # Health check — no rate limiting, no logging
    # -------------------------------------------------------------------------
    location /api/health/live {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        # Explicit rather than relying solely on the include above: the app's
        # rate limiter keys on this header, and a missing/wrong value
        # collapses every client into one shared bucket (see
        # src/lib/auth/middleware.ts's UNKNOWN_IP).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
}
