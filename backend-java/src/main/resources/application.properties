spring.application.name=motoxplus-api
server.port=${PORT:8080}
server.forward-headers-strategy=none

# The database is the SAME PostgreSQL the Next.js app (Prisma) uses. Prisma owns
# the schema and migrations, so Hibernate must never create/alter anything.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Prisma names tables/columns exactly as declared ("User", "failedLoginAttempts"),
# so keep identifiers verbatim and quoted.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Deliberately NOT setting hibernate.jdbc.time_zone: Prisma's timestamp(3) columns hold UTC wall-clock
# values with no zone, and our entities use LocalDateTime already in UTC. With that property set,
# Hibernate converts them through the JVM's zone and shifts every stored time by the UTC offset
# whenever the JVM isn't running in UTC (caught by AuthFlowIntegrationTest on an IST machine).

# REDIS_URL is optional; without it rate limiting degrades to per-process memory.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms
management.health.redis.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Tighter than Nginx's 20MB: this API only takes small JSON bodies (uploads are
# handled by the storage module and raise their own limit).
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.jwt.secret=${JWT_SECRET:}
# Set COOKIE_SECURE=true in production (HTTPS) so auth cookies are never sent over plain HTTP.
app.cookie.secure=${COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# Marketplace (docs/marketplace/PHASE-0-AUDIT.md). Flyway owns ONLY the "marketplace"
# schema; Prisma keeps "public". Nothing is migrated unless MARKETPLACE_ENABLED=true, so
# deploying this jar can never alter a database by accident.
# ---------------------------------------------------------------------------
marketplace.enabled=${MARKETPLACE_ENABLED:false}
spring.flyway.enabled=${marketplace.enabled}
spring.flyway.schemas=marketplace
spring.flyway.default-schema=marketplace
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/marketplace
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Swagger UI stays off unless asked for; the JSON spec requires authentication (deny-by-default).
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.paths-to-match=/api/v1/**
