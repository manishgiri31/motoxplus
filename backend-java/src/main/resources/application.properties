spring.application.name=motoxplus-api
server.port=${PORT:8080}
server.forward-headers-strategy=none

# The database is the SAME PostgreSQL the Next.js app (Prisma) uses. Prisma owns
# the schema and migrations, so Hibernate must never create/alter anything.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Prisma names tables/columns exactly as declared ("User", "failedLoginAttempts"),
# so keep identifiers verbatim and quoted.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Deliberately NOT setting hibernate.jdbc.time_zone: Prisma's timestamp(3) columns hold UTC wall-clock
# values with no zone, and our entities use LocalDateTime already in UTC. With that property set,
# Hibernate converts them through the JVM's zone and shifts every stored time by the UTC offset
# whenever the JVM isn't running in UTC (caught by AuthFlowIntegrationTest on an IST machine).

# REDIS_URL is optional; without it rate limiting degrades to per-process memory.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms
management.health.redis.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Tighter than Nginx's 20MB: this API only takes small JSON bodies (uploads are
# handled by the storage module and raise their own limit).
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.jwt.secret=${JWT_SECRET:}
# Set COOKIE_SECURE=true in production (HTTPS) so auth cookies are never sent over plain HTTP.
app.cookie.secure=${COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# Database ownership (single Java backend). Flyway owns the WHOLE database: "public" (the schema Prisma
# built, adopted as baseline V1) and "marketplace" (V2+). Prisma migrations are frozen.
# Migrations only run when DB_MIGRATE=true, so deploying the jar can never alter a database by
# accident; run it once on purpose (see docs/marketplace/DB-TAKEOVER.md). On an existing database V1 is
# NOT executed - it is recorded as applied, and only after BaselineGuard has verified Prisma's own
# _prisma_migrations table lists every migration V1 contains.
# ---------------------------------------------------------------------------
app.db.migrate=${DB_MIGRATE:false}
app.db.baseline-guard=true
spring.flyway.enabled=${app.db.migrate}
# Only "public" is managed by Flyway directly; V2 creates "marketplace". With create-schemas=true Flyway skips its
# non-empty-database check and would re-run V1 on an existing DB, so create-schemas must stay false.
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.create-schemas=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema built by Prisma migrations (adopted)
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Marketplace module (beans, /api/v1 endpoints). Needs V2 applied, so enable DB_MIGRATE first.
marketplace.enabled=${MARKETPLACE_ENABLED:false}

# Swagger UI stays off unless asked for; the JSON spec requires authentication (deny-by-default).
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.paths-to-match=/api/v1/**

# --- Shared services ported from Node (same env var names as the Next.js app) ---
# Email (Resend). Missing key/from = sends are skipped and logged, like Node.
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:}
# Mobile OTP: SMS_PROVIDER=whatsapp | msg91 (default msg91, as in Node).
app.sms.provider=${SMS_PROVIDER:msg91}
# Local development only: print OTPs to the log when the provider has no credentials. Never true in production.
app.sms.log-unsent-otp=${SMS_LOG_UNSENT_OTP:false}
app.sms.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.sms.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.sms.whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:login_otp}
app.sms.whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en}
app.sms.whatsapp.graph-base-url=https://graph.facebook.com/${WHATSAPP_GRAPH_API_VERSION:v25.0}
app.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
app.sms.msg91.otp-template-id=${MSG91_OTP_TEMPLATE_ID:}
# Cloudflare R2. Private bucket holds KYC documents (public access off).
app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket=${R2_BUCKET_NAME:}
app.r2.private-bucket=${R2_PRIVATE_BUCKET_NAME:}
app.r2.public-url=${R2_PUBLIC_URL:}
# Field encryption key shared with Node (src/lib/crypto/encryption.ts): 64 hex chars or base64 of 32 bytes.
app.crypto.encryption-key=${ENCRYPTION_KEY:}
# Public site URL used in email links.
app.public-url=${NEXT_PUBLIC_APP_URL:https://motoxplus.com}
# Vendor onboarding: agreement version stored with each acceptance; inbox that is told about new applications.
app.vendor.agreement-version=${NEXT_PUBLIC_SELLER_AGREEMENT_VERSION:unpublished}
app.vendor.review-email=${VENDOR_REVIEW_EMAIL:info@motoxplus.com}
# GSTIN verification (B2B dealer accounts). Cashfree Secure ID "Verify GSTIN" credentials (Verification suite,
# not the payment-gateway keys). Unset = dealer GSTINs are saved PENDING and never treated as verified.
app.gst.cashfree.client-id=${CASHFREE_VERIFICATION_CLIENT_ID:}
app.gst.cashfree.client-secret=${CASHFREE_VERIFICATION_CLIENT_SECRET:}
app.gst.cashfree.base-url=${CASHFREE_VERIFICATION_BASE_URL:https://api.cashfree.com/verification}
app.gst.recheck.enabled=${GST_RECHECK_ENABLED:true}
# Shared secret for server-to-server calls from the Next.js app (>= 32 chars; same value in both apps).
app.internal.token=${INTERNAL_API_TOKEN:}
