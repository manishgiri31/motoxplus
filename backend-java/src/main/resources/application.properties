spring.application.name=motoxplus-api
server.port=${PORT:8080}
server.forward-headers-strategy=none

# The database is the SAME PostgreSQL the Next.js app (Prisma) uses. Prisma owns
# the schema and migrations, so Hibernate must never create/alter anything.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Prisma names tables/columns exactly as declared ("User", "failedLoginAttempts"),
# so keep identifiers verbatim and quoted.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Deliberately NOT setting hibernate.jdbc.time_zone: Prisma's timestamp(3) columns hold UTC wall-clock
# values with no zone, and our entities use LocalDateTime already in UTC. With that property set,
# Hibernate converts them through the JVM's zone and shifts every stored time by the UTC offset
# whenever the JVM isn't running in UTC (caught by AuthFlowIntegrationTest on an IST machine).

# REDIS_URL is optional; without it rate limiting degrades to per-process memory.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms
management.health.redis.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Tighter than Nginx's 20MB: this API only takes small JSON bodies (uploads are
# handled by the storage module and raise their own limit).
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.jwt.secret=${JWT_SECRET:}
# Set COOKIE_SECURE=true in production (HTTPS) so auth cookies are never sent over plain HTTP.
app.cookie.secure=${COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# Database ownership (single Java backend). Flyway owns the WHOLE database: "public" (the schema Prisma
# built, adopted as baseline V1) and "marketplace" (V2+). Prisma migrations are frozen.
# Migrations only run when DB_MIGRATE=true, so deploying the jar can never alter a database by
# accident; run it once on purpose (see docs/marketplace/DB-TAKEOVER.md). On an existing database V1 is
# NOT executed - it is recorded as applied, and only after BaselineGuard has verified Prisma's own
# _prisma_migrations table lists every migration V1 contains.
# ---------------------------------------------------------------------------
app.db.migrate=${DB_MIGRATE:false}
app.db.baseline-guard=true
spring.flyway.enabled=${app.db.migrate}
# Only "public" is managed by Flyway directly; V2 creates "marketplace". With create-schemas=true Flyway skips its
# non-empty-database check and would re-run V1 on an existing DB, so create-schemas must stay false.
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.create-schemas=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema built by Prisma migrations (adopted)
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Marketplace module (beans, /api/v1 endpoints). Needs V2 applied, so enable DB_MIGRATE first.
marketplace.enabled=${MARKETPLACE_ENABLED:false}

# Swagger UI stays off unless asked for; the JSON spec requires authentication (deny-by-default).
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.paths-to-match=/api/v1/**
