# =============================================================================
# CLOUDFLARE IP RANGES — trusted for the CF-Connecting-IP header
# =============================================================================
# Generated by scripts/vps/refresh-cloudflare-ips.sh from
# https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6 —
# do not hand-edit; re-run the script instead (it overwrites this file).
#
# INSTALL: this file lives at /etc/nginx/cloudflare-ips.conf on the server
# (not inside sites-available/sites-enabled) so the refresh script can
# overwrite it in place — via cron, ideally — without touching the reviewed,
# git-tracked nginx.conf:
#   sudo cp cloudflare-ips.conf /etc/nginx/cloudflare-ips.conf
#   sudo nginx -t && sudo nginx -s reload
#
# Only the peer IPs listed here are trusted to set CF-Connecting-IP —
# ngx_http_realip_module ignores that header entirely from any address NOT
# in this list, so a client connecting directly to the origin (bypassing
# Cloudflare) cannot forge it. See VPS-HARDENING.md for the separate,
# still-needed firewall step: this file stops IP-forging over a header, not
# a direct connection to the origin — allow inbound 80/443 from Cloudflare's
# ranges only (nginx.conf's set_real_ip_from list below IS that same range
# set, so the ufw/security-group rule can reuse it) to close that off too.
#
# Last refreshed: 2026-08-26 (initial cut — same ranges as nginx.conf carried
# before this file existed). Re-run the script periodically; Cloudflare
# rotates these ranges rarely, but "rarely" isn't "never".
